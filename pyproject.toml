[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ripdb"
version = "0.1.0"
description = "Reverse-connecting pdb: ripdb.set_trace() dials out to a listener you run."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["pdb", "ipdb", "debugger", "remote", "reverse", "docker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Intended Audience :: Developers",
]
dependencies = ["ipython"]

[project.scripts]
ripdb-serve = "ripdb.serve:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["ripdb*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["ripdb"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

# IPython ships no type stubs.
[[tool.mypy.overrides]]
module = "IPython.*"
ignore_missing_imports = true
