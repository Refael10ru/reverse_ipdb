[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse_ipdb"
version = "0.1.0"
description = "Reverse-connecting pdb: ripdb.set_trace() dials out to a listener you run."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["pdb", "ipdb", "debugger", "remote", "reverse", "docker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
ipython = ["ipython"]
dev = ["pytest"]

[project.scripts]
ripdb-serve = "ripdb.serve:main"

[tool.setuptools.packages.find]
include = ["ripdb*"]
